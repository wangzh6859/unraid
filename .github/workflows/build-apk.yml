name: Build & Release APK

# 只支持手动触发：把这次要改的所有文件都上传/提交完之后，
# 再去仓库的 Actions 标签页 -> Build & Release APK -> Run workflow 手动点一下。
# 这样就不会出现"改一个文件就自动跑一次、改十次就跑十次"的情况。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          # 拉取完整提交历史和所有 tag，否则下面生成"本次更新内容"时
          # 找不到上一个版本的 tag，也拿不到完整的 commit 记录。
          fetch-depth: 0

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: 生成 Android 平台工程（首次会创建 android/ 目录，已存在的文件不会被覆盖）
        run: flutter create --platforms=android --org com.zhaohongli --project-name unraid_mobile .

      - name: 应用自定义签名构建配置
        run: cp android_overrides/app_build.gradle.kts android/app/build.gradle.kts

      - name: 修改应用显示名为 UnRaid
        run: |
          sed -i 's/android:label="[^"]*"/android:label="UnRaid"/' \
            android/app/src/main/AndroidManifest.xml

      - name: 确认已声明网络权限（避免联网请求被系统拦截导致崩溃）
        run: |
          if ! grep -q "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml; then
            sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET" />#' \
              android/app/src/main/AndroidManifest.xml
          fi

      - name: 解码签名证书
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 KEYSTORE_BASE64 secret，请先运行 generate-keystore.yml 生成证书并把它设置到仓库 Secrets 中"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks

      - name: 写入 key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: 获取依赖
        run: flutter pub get

      - name: 静态检查（Dart 语法/静态分析，有问题会在打包前报错）
        run: flutter analyze

      - name: 生成新版启动图标
        run: dart run flutter_launcher_icons

      - name: 构建 Release APK
        run: |
          BUILD_NUMBER="${{ github.run_number }}"
          # versionCode 用"自 Unix 纪元起的天数 × 10000 + Actions 运行次数"。
          # 运行次数本身在每次构建时严格递增，保证手机能"原地升级安装"；
          # 前面的天数偏移则保证：即使这个 workflow 文件以后被改名/重建
          # （run_number 会从 1 重新计数），只要不是同一天改名，versionCode
          # 依然比手机上的旧版本更大，不会出现"新版本号小于旧版本号"
          # 导致必须卸载重装的悲剧。
          DAYS_EPOCH=$(( $(date -u +%s) / 86400 ))
          VERSION_CODE=$(( DAYS_EPOCH * 10000 + BUILD_NUMBER ))
          echo "versionName=1.0.$BUILD_NUMBER  versionCode=$VERSION_CODE"
          # versionName 保持 1.0.<运行号>，与 Release 的 tag 一致
          # （应用内更新检测按 versionName 的最后一段对比）。
          flutter build apk --release \
            --build-name="1.0.$BUILD_NUMBER" \
            --build-number="$VERSION_CODE"

      - name: 重命名产物
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             "dist/unraid-mobile-1.0.${{ github.run_number }}.apk"

      - name: 生成本次更新内容（对比上一个 tag 到现在的 commit）
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          {
            echo "changelog<<EOF"
            if [ -n "$PREV_TAG" ]; then
              echo "自 $PREV_TAG 以来的改动："
              echo ""
              git log "$PREV_TAG"..HEAD --pretty=format:"- %s（%an）"
            else
              echo "首个自动构建版本"
            fi
            echo ""
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 创建 GitHub Release 并上传 APK
        uses: softprops/action-gh-release@v2
        with:
          # 每次运行的 tag 都不一样（跟 Actions 运行次数挂钩），
          # 所以每次都会新建一个 Release，旧版本 Release 会原样保留，不会被覆盖。
          tag_name: v1.0.${{ github.run_number }}
          name: UnRaid v1.0.${{ github.run_number }}
          body: |
            ${{ steps.changelog.outputs.changelog }}

            ---
            commit: ${{ github.sha }}

            手机上直接点击下方 apk 文件下载并安装即可，会自动覆盖升级旧版本，无需先卸载。
          files: dist/*.apk
